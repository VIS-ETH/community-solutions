services:
  rclone-create-bucket:
    image: busybox
    command: mkdir -p /data/s3/community-solutions
    volumes:
      - ./data:/data

  rclone:
    image: rclone/rclone
    environment:
      RCLONE_AUTH_KEY: '"rclone,rclone123"'
    ports:
      - "9000:9000"
    volumes:
      - ./data/s3:/data
      - ./configs/rclone.conf:/config/rclone/rclone.conf
    command: serve s3 local:/data --addr 0.0.0.0:9000 --allow-origin '*'
    healthcheck:
      test: ["CMD", "rclone", "version"]
      interval: 1s
      timeout: 1s
      retries: 60
    depends_on:
      rclone-create-bucket:
        condition: service_completed_successfully

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./data/sql:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres -U postgres"]
      interval: 1s
      timeout: 1s
      retries: 50

  community-solutions:
    build:
      target: backend-hotreload
      args:
        git_branch: <docker>
        git_commit: <compose>
    develop:
      watch:
        - action: sync
          path: backend/
          target: /app
          ignore:
            - __pycache__/
        - action: rebuild
          path: backend/requirements.txt
    container_name: community-solutions
    ports:
      - "8081:8081"
    env_file:
      - backend/.env.development
    healthcheck:
      interval: 1s
      timeout: 1s
      retries: 60
      test: ["CMD", "curl", "-f", "-s", "http://localhost:8081/health"]
    depends_on:
      postgres:
        condition: service_healthy
      rclone:
        condition: service_healthy

  react-frontend:
    profiles: [frontend] # only executed if the '--profile frontend' flag is given
    build:
      target: frontend-dev
      args:
        git_branch: <docker>
        git_commit: <compose>
    develop:
      watch:
        - action: sync
          path: frontend/src
          target: /app/src
        - action: rebuild
          path: frontend/package.json
    depends_on:
      community-solutions:
        condition: service_healthy
    ports:
      - "3000:3000"
    extra_hosts:
      - "rclone:127.0.0.1"
    env_file:
      - ./frontend/.env.development
    environment:
      BACKEND_HOST: community-solutions
