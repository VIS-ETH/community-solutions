services:
  community-solutions: !override
    build:
      args:
        git_branch: <docker>
        git_commit: <compose>
    container_name: community-solutions
    ports:
      - "8080:8080"
    env_file:
      - backend/.env.development
      - path: ./.env.prod
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      rclone:
        condition: service_healthy

  react-frontend: !reset
